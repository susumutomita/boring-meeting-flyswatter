name: ci

# Supply Chain Security:
# - All actions pinned to full SHA for immutable references
# - Safe Chain runs before dependency installation
# - Lifecycle scripts disabled during install
# - Minimal permissions following principle of least privilege

permissions:
  contents: read
  packages: read
  actions: read

on:
  push:
  workflow_dispatch:

env:
  # Opt into Node.js 24 for JavaScript actions ahead of the June 2026
  # default flip. Removes the deprecation warning surfaced on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - name: Setup Bun
        # oven-sh/setup-bun v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76

      # Supply Chain Security: Block the install entirely if the checked-out
      # tree already carries mini-shai-hulud 2nd indicators (compromised
      # optionalDependencies, dropper filenames, C2 strings). Runs *before*
      # any dependency code can execute.
      - name: Audit supply chain (pre-install)
        run: node scripts/security/check-supply-chain.mjs

      # Supply Chain Security: Setup safe-chain before dependency installation
      - name: Setup safe-chain
        run: |
          bun add -g @aikidosec/safe-chain
          safe-chain setup-ci

      # Supply Chain Security: Disable lifecycle scripts during install
      # Note: --safe-chain-skip-minimum-package-age is used because transitive
      # dependencies (e.g. textlint -> @modelcontextprotocol/sdk -> hono) may
      # include recently released packages that have not yet aged out of the
      # safe-chain minimum age check.
      - name: Install packages via packages.json
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      - name: lint typecheck test build
        run: |
          make before-commit
